name: NAVAREA Scraper Test

on:
  push:
    branches:
      - main
    paths:
      - 'navarea_scraper.py'
      - 'navarea_parser.py'
      - '.github/workflows/navarea-test.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]
          
      - name: Run Scraper
        run: |
          python navarea_scraper.py
          
      - name: Verify Scraper Output
        run: |
          if [ ! -f navarea_1_warnings.txt ]; then
            echo "Scraper failed: navarea_1_warnings.txt not found!"
            exit 1
          fi
          echo "Scraper successfully generated navarea_1_warnings.txt"
          
      - name: Run Parser
        run: |
          python navarea_parser.py
          
      - name: Verify Parser Output
        run: |
          if [ ! -f parsed_warnings.json ]; then
            echo "Parser failed: parsed_warnings.json not found!"
            exit 1
          fi
          
          # Basic validation to ensure the JSON has the expected structure
          HAS_DATA=$(python -c "import json; data=json.load(open('parsed_warnings.json')); print('OK' if 'nav_warnings' in data else 'FAIL')")
          
          if [ "$HAS_DATA" != "OK" ]; then
            echo "Parser failed: Invalid JSON structure!"
            exit 1
          fi
          
          echo "Parser successfully generated and validated parsed_warnings.json"
          
      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: navarea-warnings-data
          path: |
            navarea_1_warnings.txt
            parsed_warnings.json
          retention-days: 5
